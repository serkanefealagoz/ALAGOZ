<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALAGÖZ - Giriş</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center h-screen px-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md">
        <h2 class="text-3xl font-black mb-2 text-center text-indigo-400">ALAGÖZ</h2>
        <p class="text-xs text-center text-slate-400 mb-6">Birebir Güvenli İletişim Platformu</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-4 p-3 text-xs rounded-xl bg-emerald-500/10 text-emerald-300 border border-emerald-500/20">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Kimlik Numaranız (ID)</label>
                <input type="text" name="custom_id" required placeholder="Örn: 482910" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 focus:outline-none focus:border-indigo-500 text-slate-200">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Şifre</label>
                <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 focus:outline-none focus:border-indigo-500 text-slate-200">
            </div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-bold transition shadow-lg shadow-indigo-600/30">Giriş Yap</button>
        </form>
        <p class="mt-6 text-center text-xs text-slate-400">Hesabın yok mu? <a href="/register" class="text-indigo-400 hover:underline font-semibold">Kayıt Ol</a></p>
    </div>
</body>
</html>
