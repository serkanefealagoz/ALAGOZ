<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALAGÖZ - Giriş Yap</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center h-screen px-4 font-sans">
    <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 p-8 rounded-3xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black tracking-wider text-indigo-400">ALAGÖZ</h1>
            <p class="text-xs text-slate-400 mt-1">Güvenli İletişim ve Canlı Panel</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-5 p-3.5 text-xs rounded-2xl bg-emerald-500/10 text-emerald-300 border border-emerald-500/20 text-center font-medium">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Kimlik Numarası (ID)</label>
                <input type="text" name="custom_id" required placeholder="Örn: 482910" class="w-full px-4 py-3 rounded-2xl bg-slate-950 border border-slate-800 focus:outline-none focus:border-indigo-500 text-sm text-slate-200 transition">
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Şifre</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-2xl bg-slate-950 border border-slate-800 focus:outline-none focus:border-indigo-500 text-sm text-slate-200 transition">
            </div>
            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 rounded-2xl font-bold text-sm transition shadow-lg shadow-indigo-600/30 mt-2">Giriş Yap</button>
        </form>
        <p class="mt-6 text-center text-xs text-slate-400">Hesabın yok mu? <a href="/register" class="text-indigo-400 hover:underline font-semibold">Kayıt Ol</a></p>
    </div>
</body>
</html>
