<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALAGÖZ - Kayıt Ol</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center h-screen px-4">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md">
        <h2 class="text-3xl font-black mb-2 text-center text-indigo-400">ALAGÖZ</h2>
        <p class="text-xs text-center text-slate-400 mb-6">Yeni Hesap Oluştur (Size Özel ID Üretilir)</p>
        
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Adınız / Rumuzunuz</label>
                <input type="text" name="username" required placeholder="Adınız" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 focus:outline-none focus:border-indigo-500 text-slate-200">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Şifre Belirleyin</label>
                <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 focus:outline-none focus:border-indigo-500 text-slate-200">
            </div>
            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold transition shadow-lg shadow-emerald-600/30">Kayıt Ol ve ID Al</button>
        </form>
        <p class="mt-6 text-center text-xs text-slate-400">Zaten hesabın var mı? <a href="/login" class="text-indigo-400 hover:underline font-semibold">Giriş Yap</a></p>
    </div>
</body>
</html>
