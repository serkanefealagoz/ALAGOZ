<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALAGÖZ - Kayıt Ol</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center h-screen px-4 font-sans">
    <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800/80 p-8 rounded-3xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black tracking-wider text-indigo-400">ALAGÖZ</h1>
            <p class="text-xs text-slate-400 mt-1">Yeni Hesap Oluştur</p>
        </div>
        
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Adınız / Rumuzunuz</label>
                <input type="text" name="username" required placeholder="Adınız" class="w-full px-4 py-3 rounded-2xl bg-slate-950 border border-slate-800 focus:outline-none focus:border-indigo-500 text-sm text-slate-200 transition">
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Şifre Belirleyin</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-2xl bg-slate-950 border border-slate-800 focus:outline-none focus:border-indigo-500 text-sm text-slate-200 transition">
            </div>
            <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 rounded-2xl font-bold text-sm transition shadow-lg shadow-emerald-600/30 mt-2">Kayıt Ol ve ID Al</button>
        </form>
        <p class="mt-6 text-center text-xs text-slate-400">Zaten hesabın var mı? <a href="/login" class="text-indigo-400 hover:underline font-semibold">Giriş Yap</a></p>
    </div>
</body>
</html>
