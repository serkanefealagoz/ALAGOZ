<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Panel - Görüşme Odası</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen flex flex-col">
    <!-- Üst Bar -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold text-indigo-400">🚀 Proje Canlı Panel</h1>
        <div class="flex items-center gap-4">
            <span class="text-slate-300 text-sm">Merhaba, <strong class="text-white">{{ username }}</strong></span>
            <a href="/logout" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-lg text-sm transition duration-200 border border-red-500/30">Çıkış Yap</a>
        </div>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="flex-1 p-6 flex flex-col items-center justify-center">
        <div class="bg-slate-800/60 backdrop-blur border border-slate-700 p-8 rounded-2xl shadow-xl max-w-xl w-full text-center space-y-4">
            <h2 class="text-2xl font-semibold text-slate-200">Sisteme Başarıyla Giriş Yaptın!</h2>
            <p class="text-slate-400 text-sm">Dünyanın neresinde olursan ol, güvenli bir şekilde bu panel üzerinden sesli ve yazılı olarak bağlanabilirsin.</p>
            
            <!-- Buraya eski sesli arama / socket butonlarını koyabilirsin -->
            <div class="pt-4 border-t border-slate-700/60">
                <span class="inline-block px-3 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-full text-xs font-medium">Bağlantı Durumu: Aktif 🟢</span>
            </div>
        </div>
    </main>
</body>
</html>
