<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALAGÖZ - Sohbet Paneli</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">
    
    <!-- Üst Header -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-6 py-3.5 flex justify-between items-center shadow-md z-20">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-black text-white shadow-lg shadow-indigo-600/30">A</div>
            <div>
                <h1 class="text-base font-extrabold tracking-wide text-indigo-400">ALAGÖZ</h1>
                <p class="text-[11px] text-slate-400">ID'niz: <strong class="text-emerald-400 font-mono">{{ current_user.custom_id }}</strong> ({{ current_user.username }})</p>
            </div>
        </div>
        <a href="/logout" class="bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white px-4 py-2 rounded-xl text-xs font-semibold transition border border-red-500/20">Çıkış Yap</a>
    </header>

    <!-- Ana Ekran -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Sol Kenar: Arama + Tüm Üyeler Listesi -->
        <aside class="w-full md:w-80 bg-slate-900/40 border-r border-slate-800 flex flex-col p-4 gap-4">
            <!-- ID Arama Kutusu -->
            <div class="flex gap-2">
                <input type="text" id="search-id-input" placeholder="ID ile Ara (Örn: 482910)" class="flex-1 px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                <button onclick="searchUser()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition shadow-md shadow-indigo-600/20">Bul</button>
            </div>

            <!-- Sistemdeki Tüm Üyeler Listesi (Online/Offline Durumlu) -->
            <div class="flex-1 overflow-y-auto space-y-2 pr-1" id="all-users-list">
                <p class="text-xs text-slate-500 text-center py-4">Üyeler yükleniyor...</p>
            </div>
        </aside>

        <!-- Sağ Taraf: Birebir Sohbet & Sesli Görüşme Alanı -->
        <section class="flex-1 flex flex-col bg-slate-950/50 relative">
            <!-- Sohbet Üst Bilgi -->
            <div id="chat-header" class="px-6 py-3 bg-slate-900/80 border-b border-slate-800 text-xs font-bold text-slate-200 hidden flex justify-between items-center z-10">
                <div class="flex items-center gap-2">
                    <span id="active-user-dot" class="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
                    <span id="active-chat-title">Sohbet Seçilmedi</span>
                </div>
                <button id="call-btn" onclick="toggleAudioCall()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow-md shadow-emerald-600/20 flex items-center gap-1.5">
                    📞 Sesli Aramayı Başlat
                </button>
            </div>

            <!-- Mesaj Akışı -->
            <div id="chat-messages" class="flex-1 p-6 overflow-y-auto space-y-4 flex flex-col">
                <div class="m-auto text-center space-y-2">
                    <div class="w-16 h-16 rounded-3xl bg-slate-900 border border-slate-800 flex items-center justify-center mx-auto text-2xl">💬</div>
                    <p class="text-sm text-slate-400 font-medium">Sol taraftan bir kullanıcı seçerek veya ID aratarak sohbete başla.</p>
                </div>
            </div>

            <!-- Mesaj Gönderme Çubuğu -->
            <form id="chat-form" onsubmit="sendPrivateMessage(event)" class="p-4 bg-slate-900/80 border-t border-slate-800 flex gap-3 hidden z-10">
                <input type="text" id="message-input" autocomplete="off" placeholder="Mesajınızı yazın..." class="flex-1 px-4 py-3 bg-slate-950 border border-slate-800 rounded-2xl text-sm focus:outline-none focus:border-indigo-500 text-slate-200 transition">
                <button type="submit" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl text-sm font-semibold transition shadow-lg shadow-indigo-600/30">Gönder</button>
            </form>
        </section>
    </div>

    <!-- Script Kodları -->
    <script>
        const socket = io();
        const myId = "{{ current_user.custom_id }}";
        const myName = "{{ current_user.username }}";
        let targetId = null;
        let localStream = null;
        let peerConnection = null;
        let inCall = false;

        const iceServers = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        // Sayfa açıldığında tüm kullanıcıları çek
        function loadUsers() {
            fetch('/get_all_users')
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    renderUserList(data.users);
                }
            });
        }

        function renderUserList(users) {
            const listDiv = document.getElementById('all-users-list');
            if(users.length === 0) {
                listDiv.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">Başka kayıtlı üye yok.</p>`;
                return;
            }
            
            listDiv.innerHTML = '';
            users.forEach(u => {
                const item = document.createElement('div');
                item.className = `p-3 rounded-2xl bg-slate-900/60 border border-slate-800/80 cursor-pointer hover:bg-slate-800 transition flex items-center justify-between group`;
                item.onclick = () => startChat(u.custom_id, u.username, u.online);
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="relative w-9 h-9 rounded-xl bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center font-bold text-indigo-300 text-xs">
                            ${u.username[0].toUpperCase()}
                            <span id="dot-${u.custom_id}" class="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-slate-950 ${u.online ? 'bg-emerald-500' : 'bg-slate-500'}"></span>
                        </div>
                        <div>
                            <p class="text-xs font-bold text-slate-200 group-hover:text-indigo-400 transition">${u.username}</p>
                            <p class="text-[10px] text-slate-400 font-mono">ID: ${u.custom_id}</p>
                        </div>
                    </div>
                    <span class="text-[10px] text-slate-500 bg-slate-950 px-2 py-1 rounded-lg border border-slate-800">Sohbet Et</span>
                `;
                listDiv.appendChild(item);
            });
        }

        loadUsers();

        // Anlık online/offline durum güncelleme dinleyicisi
        socket.on('update_status', function(data) {
            const dot = document.getElementById(`dot-${data.custom_id}`);
            if(dot) {
                dot.className = `absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-slate-950 ${data.online ? 'bg-emerald-500' : 'bg-slate-500'}`;
            }
        });

        // Arama Butonu Fonksiyonu
        function searchUser() {
            const queryId = document.getElementById('search-id-input').value.trim();
            if(!queryId) return;

            fetch(`/search_user?id=${queryId}`)
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    startChat(data.custom_id, data.username, data.online);
                } else {
                    alert(data.message);
                }
            });
        }

        function startChat(id, name, isOnline) {
            targetId = id;
            document.getElementById('active-chat-title</u>').innerText = `${name} (ID: ${id})`;
            const dotElem = document.getElementById('active-user-dot');
            dotElem.className = `w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-emerald-500' : 'bg-slate-500'}`;
            
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('chat-form').classList.remove('hidden');
            document.getElementById('chat-messages').innerHTML = `
                <div class="m-auto text-center">
                    <span class="px-4 py-1.5 bg-slate-900 border border-slate-800 rounded-full text-xs text-slate-400 font-medium">🔒 ${name} ile güvenli birebir hat kuruldu</span>
                </div>
            `;
            
            socket.emit('join_private_room', { user1: myId, user2: targetId });
        }

        function sendPrivateMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const msg = input.value.trim();
            if(msg && targetId) {
                socket.emit('send_private_message', {
                    sender_id: myId,
                    receiver_id: targetId,
                    sender_name: myName,
                    msg: msg
                });
                appendMessage(myName, msg, true);
                input.value = '';
            }
        }

        socket.on('receive_private_message', function(data) {
            if(data.sender_id === targetId) {
                appendMessage(data.sender_name, data.msg, false);
            }
        });

        function appendMessage(sender, msg, isMe) {
            const chatBox = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-3`;
            div.innerHTML = `
                <div class="px-4 py-2.5 rounded-2xl max-w-sm text-sm shadow-sm ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-900 text-slate-200 border border-slate-800 rounded-bl-none'}">
                    ${msg}
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- SESLİ ARAMA MANTIĞI (WebRTC) ---
        async function toggleAudioCall() {
            const btn = document.getElementById('call-btn');
            if(!inCall) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    inCall = true;
                    btn.className = "px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-bold transition shadow-md shadow-red-600/20 flex items-center gap-1.5";
                    btn.innerHTML = "🔴 Aramayı Kapat";
                    
                    setupPeerConnection();
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    socket.emit('voice_signal', { sender_id: myId, target_id: targetId, type: 'offer', sdp: offer });
                } catch(err) {
                    alert("Mikrofon izni alınamadı!");
                }
            } else {
                hangUp();
            }
        }

        function setupPeerConnection() {
            peerConnection = new RTCPeerConnection(iceServers);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = event => {
                const remoteAudio = new Audio();
                remoteAudio.srcObject = event.streams[0];
                remoteAudio.autoplay = true;
            };

            peerConnection.onicecandidate = event => {
                if(event.candidate) {
                    socket.emit('voice_signal', { sender_id: myId, target_id: targetId, type: 'candidate', candidate: event.candidate });
                }
            };
        }

        socket.on('voice_signal', async data => {
            if(!peerConnection) {
                setupPeerConnection();
            }
            if(data.type === 'offer') {
                if(!inCall) {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
                    inCall = true;
                    const btn = document.getElementById('call-btn');
                    btn.className = "px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-bold transition shadow-md shadow-red-600/20 flex items-center gap-1.5";
                    btn.innerHTML = "🔴 Aramayı Kapat";
                }
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                socket.emit('voice_signal', { sender_id: myId, target_id: targetId, type: 'answer', sdp: answer });
            } else if(data.type === 'answer') {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
            } else if(data.type === 'candidate') {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        function hangUp() {
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            if(peerConnection) peerConnection.close();
            peerConnection = null;
            localStream = null;
            inCall = false;
            
            const btn = document.getElementById('call-btn');
            btn.className = "px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition shadow-md shadow-emerald-600/20 flex items-center gap-1.5";
            btn.innerHTML = "📞 Sesli Aramayı Başlat";
            
            socket.emit('voice_signal', { sender_id: myId, target_id: targetId, type: 'hangup' });
        }
    </script>
</body>
</html>
