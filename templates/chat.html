<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALAGÖZ - Canlı Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">
    
    <!-- Üst Header -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 sm:px-6 py-3 flex justify-between items-center shadow-lg z-10">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-white shadow-lg shadow-indigo-500/30">A</div>
            <div>
                <h1 class="text-lg font-bold tracking-wide text-indigo-400">ALAGÖZ</h1>
                <span class="text-[10px] text-emerald-400 font-medium flex items-center gap-1">● Canlı Bağlantı</span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span class="hidden sm:inline text-xs text-slate-300">Merhaba, <strong class="text-white">{{ username }}</strong></span>
            <a href="/logout" class="bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition border border-red-500/20">Çıkış</a>
        </div>
    </header>

    <!-- Ana Çalışma Alanı (Responsive Grid) -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Sol: Kullanıcı Listesi (Mobilde üstte kompakt görünür) -->
        <aside class="w-full md:w-80 bg-slate-900/50 border-r border-slate-800 p-4 flex flex-col max-h-48 md:max-h-full">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Sistemdeki Üyeler</h3>
            <div class="flex-1 overflow-y-auto space-y-2 pr-1">
                {% for u in users %}
                <div class="flex items-center gap-3 p-2 rounded-xl bg-slate-900/80 border border-slate-800">
                    <div class="w-7 h-7 rounded-full bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center font-bold text-indigo-300 text-xs">
                        {{ u.username[0]|upper }}
                    </div>
                    <span class="text-sm font-medium text-slate-200 truncate">{{ u.username }}</span>
                </div>
                {% endfor %}
            </div>
        </aside>

        <!-- Sağ: Mesajlaşma ve Kontrol Paneli -->
        <section class="flex-1 flex flex-col bg-slate-950/40 relative">
            
            <!-- Sohbet / Mesaj Akış Alanı -->
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3">
                <div class="flex justify-center">
                    <span class="px-3 py-1 bg-slate-900 border border-slate-800 rounded-full text-xs text-slate-400">ALAGÖZ Güvenli Odasına Hoş Geldiniz! 🚀</span>
                </div>
            </div>

            <!-- Sesli Arama Kontrolleri -->
            <div class="px-4 py-2 bg-slate-900/40 border-t border-slate-800 flex items-center justify-center gap-4">
                <button id="mic-btn" onclick="toggleMic()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-lg transition flex items-center gap-2">
                    🎙️ Sesli Aramayı Başlat
                </button>
            </div>

            <!-- Mesaj Gönderme Çubuğu -->
            <form id="chat-form" onsubmit="sendMessage(event)" class="p-3 bg-slate-900 border-t border-slate-800 flex gap-2">
                <input type="text" id="message-input" autocomplete="off" placeholder="Mesajınızı yazın..." class="flex-1 px-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
                <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold transition">Gönder</button>
            </form>

        </section>
    </main>

    <!-- Socket.JS Mantığı -->
    <script>
        const socket = io();
        const username = "{{ username }}";

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            if (input.value.trim() !== '') {
                socket.emit('send_message', { username: username, msg: input.value });
                input.value = '';
            }
        }

        socket.on('receive_message', function(data) {
            const chatBox = document.getElementById('chat-messages');
            const isMe = data.username === username;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-2`;
            msgDiv.innerHTML = `
                <span class="text-[10px] text-slate-400 mb-0.5">${data.username}</span>
                <div class="px-4 py-2 rounded-2xl max-w-xs sm:max-w-md text-sm ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none'}">
                    ${data.msg}
                </div>
            `;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        let micActive = false;
        function toggleMic() {
            micActive = !micActive;
            const btn = document.getElementById('mic-btn');
            if (micActive) {
                btn.className = "px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs font-semibold shadow-lg transition flex items-center gap-2";
                btn.innerHTML = "🔴 Mikrofon Açık (Yayında)";
            } else {
                btn.className = "px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-lg transition flex items-center gap-2";
                btn.innerHTML = "🎙️ Sesli Aramayı Başlat";
            }
        }
    </script>
</body>
</html>
