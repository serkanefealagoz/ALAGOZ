<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALAGÖZ - Sohbet</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">
    
    <!-- Üst Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex justify-between items-center shadow-md z-10">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-white">A</div>
            <div>
                <h1 class="text-sm font-bold text-indigo-400">ALAGÖZ</h1>
                <span class="text-[10px] text-slate-400">Kimliğiniz: <strong class="text-emerald-400">{{ current_user.custom_id }}</strong> ({{ current_user.username }})</span>
            </div>
        </div>
        <a href="/logout" class="bg-red-500/10 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition border border-red-500/20">Çıkış</a>
    </header>

    <!-- Ana Panel -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Sol Kenar: Kimlik No ile Kişi Arama -->
        <aside class="w-full md:w-80 bg-slate-900/40 border-r border-slate-800 p-4 flex flex-col gap-3">
            <div class="flex gap-2">
                <input type="text" id="search-id-input" placeholder="Kişinin ID'si (Örn: 482910)" class="flex-1 px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                <button onclick="searchUser()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition">Bul</button>
            </div>
            
            <div id="search-result" class="flex-1 overflow-y-auto">
                <p class="text-xs text-slate-500 text-center mt-4">Bağlanmak istediğin kişinin 6 haneli Kimlik Numarasını yukarıya yaz.</p>
            </div>
        </aside>

        <!-- Sağ Taraf: Birebir Sohbet ve Arama Ekranı -->
        <section class="flex-1 flex flex-col bg-slate-950 relative">
            <div id="chat-header" class="p-3 bg-slate-900/60 border-b border-slate-800 text-xs font-semibold text-slate-300 hidden flex justify-between items-center">
                <span id="active-chat-title">Sohbet Ediliyor...</span>
                <button id="call-btn" onclick="toggleAudioCall()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold transition">📞 Sesli Ara</button>
            </div>

            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 flex flex-col">
                <div class="m-auto text-center text-slate-500 text-sm">
                    Sol taraftan bir kullanıcı ID'si aratıp sohbeti başlatabilirsin.
                </div>
            </div>

            <form id="chat-form" onsubmit="sendPrivateMessage(event)" class="p-3 bg-slate-900 border-t border-slate-800 flex gap-2 hidden">
                <input type="text" id="message-input" autocomplete="off" placeholder="Mesaj yazın..." class="flex-1 px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-indigo-500 text-slate-200">
                <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-semibold transition">Gönder</button>
            </form>
        </section>
    </div>

    <!-- Script Kodları -->
    <script>
        const socket = io();
        const myId = "{{ current_user.custom_id }}";
        const myName = "{{ current_user.username }}";
        let targetId = null;

        function searchUser() {
            const queryId = document.getElementById('search-id-input').value.trim();
            if(!queryId) return;

            fetch(`/search_user?id=${queryId}`)
            .then(res => res.json())
            .then(data => {
                const resultDiv = document.getElementById('search-result');
                if(data.success) {
                    resultDiv.innerHTML = `
                        <div onclick="startChat('${data.custom_id}', '${data.username}')" class="p-3 rounded-xl bg-slate-900 border border-indigo-500/40 cursor-pointer hover:bg-slate-800 transition flex items-center justify-between">
                            <div>
                                <p class="text-sm font-bold text-white">${data.username}</p>
                                <p class="text-[10px] text-emerald-400">ID: ${data.custom_id}</p>
                            </div>
                            <span class="text-xs bg-indigo-600 px-2 py-1 rounded-lg text-white font-semibold">Sohbet Et</span>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="text-xs text-red-400 text-center mt-4">${data.message}</p>`;
                }
            });
        }

        function startChat(id, name) {
            targetId = id;
            document.getElementById('active-chat-title').innerText = `${name} (ID: ${id}) ile Sohbet`;
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('chat-form').classList.remove('hidden');
            document.getElementById('chat-messages').innerHTML = `<div class="text-center text-xs text-slate-500 my-2">-- Güvenli Birebir Hat Kuruldu --</div>`;
            
            // Özel odaya katıl
            socket.emit('join_private_room', { user1: myId, user2: targetId });
        }

        function sendPrivateMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const msg = input.value.trim();
            if(msg && targetId) {
                socket.emit('send_private_message', {
                    sender_id: myId,
                    receiver_id: targetId,
                    sender_name: myName,
                    msg: msg
                });
                
                // Kendi mesajımızı ekrana ekleyelim
                appendMessage(myName, msg, true);
                input.value = '';
            }
        }

        socket.on('receive_private_message', function(data) {
            if(data.sender_id === targetId || data.sender_id === myId) {
                const isMe = data.sender_id === myId;
                if(!isMe) {
                    appendMessage(data.sender_name, data.msg, false);
                }
            }
        });

        function appendMessage(sender, msg, isMe) {
            const chatBox = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-2`;
            div.innerHTML = `
                <div class="px-4 py-2 rounded-2xl max-w-xs text-sm ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-800 text-slate-200 rounded-bl-none'}">
                    ${msg}
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        let inCall = false;
        function toggleAudioCall() {
            inCall = !inCall;
            const btn = document.getElementById('call-btn');
            if(inCall) {
                btn.className = "px-3 py-1 bg-red-600 hover:bg-red-500 text-white rounded-lg text-xs font-bold transition";
                btn.innerText = "🔴 Aramayı Kapat";
            } else {
                btn.className = "px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold transition";
                btn.innerText = "📞 Sesli Ara";
            }
        }
    </script>
</body>
</html>
