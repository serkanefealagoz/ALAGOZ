<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center h-screen">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-96 border border-slate-700">
        <h2 class="text-2xl font-bold mb-6 text-center text-indigo-400">Yeni Hesap Oluştur</h2>
        
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Kullanıcı Adı</label>
                <input type="text" name="username" required class="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-slate-300">Şifre</label>
                <input type="password" name="password" required class="w-full px-4 py-2 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-semibold transition duration-200">Kayıt Ol</button>
        </form>
        <p class="mt-4 text-center text-sm text-slate-400">Zaten hesabın var mı? <a href="/login" class="text-indigo-400 hover:underline">Giriş Yap</a></p>
    </div>
</body>
</html>
